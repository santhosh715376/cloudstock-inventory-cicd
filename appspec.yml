version: 0.0
os: linux
files:
  - source: /
    destination: /var/www/cloudstock
permissions:
  - object: /var/www/cloudstock/scripts
    pattern: "**/*.sh"
    owner: root
    mode: 755
hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 300
      runas: root
  AfterInstall:
    - location: scripts/install.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 300
      runas: root
  ValidateService:
    - location: scripts/health-check.sh
      timeout: 300
      runas: root
