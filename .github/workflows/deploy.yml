name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Start MySQL Database for Testing
        run: |
          docker compose up -d mysql
          sleep 15

      - name: Run Tests
        run: npm run test
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 3307

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Package Deployment Artifact
        run: |
          mkdir -p deploy_artifact/frontend
          cp -r backend deploy_artifact/
          cp -r frontend/dist deploy_artifact/frontend/dist
          cp -r database deploy_artifact/
          cp -r scripts deploy_artifact/
          cp package*.json deploy_artifact/
          rm -rf deploy_artifact/backend/node_modules
          tar -czf cloudstock.tar.gz -C deploy_artifact .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudstock-deployment
          path: cloudstock.tar.gz
          retention-days: 1

  cd:
    name: Continuous Deployment
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: cloudstock-deployment

      - name: Transfer Artifact to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "cloudstock.tar.gz"
          target: "/tmp"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            # Ensure target directory exists
            mkdir -p ${{ secrets.EC2_APP_DIR }}
            cd ${{ secrets.EC2_APP_DIR }}
            
            echo "Extracting new deployment artifact..."
            # Extracting over the directory replaces updated files.
            # It does NOT delete existing un-archived files like .env or logs!
            tar -xzf /tmp/cloudstock.tar.gz -C .
            
            echo "Installing production dependencies for backend..."
            cd backend
            npm ci --omit=dev
            
            echo "Restarting application via PM2..."
            cd ..
            pm2 restart cloudstock || pm2 start backend/src/app.js --name cloudstock
            pm2 save
            
            echo "Verifying Health Check..."
            sleep 5
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health)
            if [ "$HTTP_STATUS" -eq 200 ]; then
                echo "Deployment Success: Health check passed!"
                exit 0
            else
                echo "Deployment Failed: Health check failed with status: $HTTP_STATUS"
                exit 1
            fi
